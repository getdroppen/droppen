<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the notch and the home
         indicator; index.css pads the bottom-most chrome back out with
         env(safe-area-inset-*). interactive-widget=resizes-content makes
         Android's soft keyboard shrink the layout viewport (so 100% height
         follows it). iOS has ignored the token so far: WebKit pans the visual
         viewport to the focused field instead, and lib/kb-native.ts leaves that
         to it. WebKit's own trunk turned the token on for Apple platforms in
         Aug 2026 (319118@main). Where a release ships it, the layout viewport,
         and with it the shell, should shrink above the keyboard as on Android,
         and lib/kb-native.ts then has nothing to do. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The black drop-D on a transparent ground. Browsers that take SVG use
         favicon.svg, which turns white in a dark browser so it never vanishes
         into a dark tab bar; the PNGs are the fallbacks (16 is hand-pixelled).
         Regenerate with `pnpm gen:pwa`. -->
    <link rel="icon" href="/favicon.png?v=da6ac33da5d7" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png?v=f0b3e9710290" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon.svg?v=95fcd1389a76" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3ff622daea76" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Droppen" />
    <!-- "default", not "black-translucent": the app shell has no top safe-area
         padding, so the status bar must stay reserved rather than overlap it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

         flash on every cold start. Portrait only, since a mismatched

         is all the query can see, so an in-app theme override is off by one
         launch. Regenerate the images and this list with `pnpm gen:pwa`. -->

    <title>Droppen</title>
    <!-- What a link to droppen.app shows before any script runs (search
         results, chat previews). zh-CN is the page's first language; the
         landing page (features/landing) puts the reader's own language into
         the title and description once it loads. og.png is the hero image;
         ?v= is its content hash. -->
    <meta name="description" content="Claude Code 和 Codex 照常在你自己的电脑上跑，你在手机上看进度、回答提问、开终端。所有设备一个屏，端到端加密：你的代码，我们看不到。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Droppen" />
    <meta property="og:url" content="https://www.droppen.app/" />
    <meta property="og:title" content="Droppen — 电脑上的 AI，手机上接着用" />
    <meta property="og:description" content="Claude Code 和 Codex 照常在你自己的电脑上跑，你在手机上看进度、回答提问、开终端。所有设备一个屏，端到端加密：你的代码，我们看不到。" />
    <meta property="og:image" content="https://www.droppen.app/og.png?v=82d0fa6cf2c0" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="电脑上的 AI，手机上接着用：你的电脑和你的手机之间，Droppen 只看得到一串密文" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="zh_TW" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var mode = localStorage.getItem("rh.theme");
        var dark =
          mode === "dark" ||
          (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        // Match the installed app's chrome to the theme we just resolved.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0f1115" : "#ffffff");
        // Cached copy of the server-side fontSize pref; avoids a resize flash.
        var pct = { small: "87.5%", large: "112.5%", xlarge: "125%" }[
          localStorage.getItem("rh.fontSize")
        ];
        if (pct) document.documentElement.style.fontSize = pct;
        // iOS zooms the page when a focused field's font is under 16px. index.css
        // already forces 16px on phones; maximum-scale=1 is the belt-and-braces
        // for the fields it cannot reach. iOS 10+ still honours pinch-zoom, so
        // accessibility is intact. Android really does lock zoom, so skip it
        // there. iPadOS 13+ reports MacIntel, hence the touch-point check.
        if (
          /iPhone|iPad|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        ) {
          document
            .querySelector('meta[name="viewport"]')
            .setAttribute(
              "content",
              "width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content",
            );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
