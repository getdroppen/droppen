# The default rules, and four kinds of test fixture they flag that protect
# nothing. Each allowance below takes one rule (`generic-api-key`, the only
# one that flags them), in the files named (`paths`, anchored), and, but for
# the generated vectors, one exact secret (`regexTarget = "secret"`,
# anchored): `condition = "AND"` makes all three hold at once, so a real key
# in the same file, or on the same line, is still a finding.
[extend]
useDefault = true

# The protocol crate's `vectors/*.json` are generated deterministically from
# fixed seeds (`droppen-proto/src/vectors.rs`, `web/test/e2e-ts-vectors.test.ts`)
# so the Rust and WebCrypto sides can check each other byte for byte. The keys
# in them are test fixtures, and the generic-api-key rule flags every one. The
# path is listed under both crate names and both layouts (`server-rs/` before
# the crates moved to the root): an allowlist entry is kept once added, and
# the history scan reads every commit of every branch.
[[allowlists]]
description = "the cloud protocol's deterministic interop vectors"
targetRules = ["generic-api-key"]
paths = ['''^server-rs/crates/rh-proto/vectors/[^/]+\.json$''', '''^server-rs/crates/droppen-proto/vectors/[^/]+\.json$''', '''^crates/droppen-proto/vectors/[^/]+\.json$''']

# `dGhlIHNhbXBsZSBub25jZQ==` is the `Sec-WebSocket-Key` of RFC 6455 §1.3 ("the
# sample nonce"), which the auth tests send to make a request a WebSocket
# handshake: a published example, not a credential. Both files the tests have
# lived in stay named, in both layouts: the history scan reads every commit of
# every branch.
[[allowlists]]
description = "RFC 6455's sample WebSocket key in the auth tests"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^server-rs/src/auth/routes\.rs$''', '''^server-rs/src/api/auth_routes\.rs$''', '''^crates/droppen-server/src/auth/routes\.rs$''', '''^crates/droppen-server/src/api/auth_routes\.rs$''']
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

# Made-up OpenAI API keys: the tests that hand a key to `codex login` check it
# goes where it should and nowhere else.
[[allowlists]]
description = "a made-up OpenAI API key in the setup tests"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^server-rs/src/setup/tasks\.rs$''', '''^server-rs/crates/droppen-setup/src/tasks\.rs$''', '''^crates/droppen-server/src/setup/tasks\.rs$''', '''^crates/droppen-setup/src/tasks\.rs$''']
regexTarget = "secret"
regexes = ['''^sk-proj-TESTKEY0123456789abcdefghijklmnop$''']

[[allowlists]]
description = "a made-up OpenAI API key in the setup guide's tests"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^web/test/setup-tools-live\.test\.tsx$''']
regexTarget = "secret"
regexes = ['''^sk-test-0123456789abcdef$''']

# The proxy's own token fixtures: `0123…cdef` is a made-up hex token in the
# config and device-option tests, and the two `dpa_…` strings are the shape
# of an A2A secret for the audit fixture and the settings DOM test.
[[allowlists]]
description = "a made-up proxy token in the proxy's tests"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^crates/droppen-a2a-proxy/src/config\.rs$''', '''^crates/droppen-a2a-proxy/src/lib\.rs$''']
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef$''']

[[allowlists]]
description = "the shape of an A2A secret in the web fixtures"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^web/ui-audit/a2a\.tsx$''', '''^web/test/a2a-settings-dom\.test\.tsx$''']
regexTarget = "secret"
regexes = ['''^dpa_n4x8w2_[A-Za-z0-9_-]+$''']
