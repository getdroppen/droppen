# The Droppen desktop app: its own workspace, so `server-rs` builds (and the
# CI that runs them) never compile Tauri, and this one never compiles the
# server binary: the server reaches the app as a prebuilt sidecar placed by
# `build.sh`. The only server-side crate it builds is `droppen-search-path`,
# the dependency-free PATH rule both sides must agree on.
[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
edition = "2021"
publish = false
license = "AGPL-3.0-only"

# As in `server-rs/Cargo.toml`: a guard made in a match/if-let/while-let
# scrutinee lives until the end of the whole block in edition 2021, and a std
# guard held across an `.await` blocks the thread. Each member opts in with
# `[lints] workspace = true`.
[workspace.lints.clippy]
significant_drop_in_scrutinee = "deny"
await_holding_lock = "deny"
