# `cargo audit` for desktop/Cargo.lock (.github/workflows/audit.yml runs it
# from this directory; update-signer/ has its own lockfile and no ignores).
# Each entry below was checked against what is actually compiled for the
# app's targets. Recheck an entry whenever the crate it names moves, and drop
# it once a fixed version is in the lock.
[advisories]
ignore = []
