name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, whatever the repository's default for the token is: no job here
# writes to the repository (artifacts and caches do not need the token).
permissions:
  contents: read

jobs:
  # What the change set touches: one output per job below, from
  # `.github/scripts/ci-changes.sh`. A job whose area is false is skipped, and
  # GitHub counts a skipped job as success for its required check, so a pull
  # request that touches only docs still merges. A push to main, a manual run,
  # any `.github/` path and any doubt in the detector run every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      # `|| 'true'`: an output the step never wrote (a bug on our side) means
      # run the job; only a written `false` skips it.
      web: ${{ steps.detect.outputs.web || 'true' }}
      web_tests: ${{ steps.detect.outputs.web_tests || 'true' }}
      ui_audit: ${{ steps.detect.outputs.ui_audit || 'true' }}
      web_reproducible: ${{ steps.detect.outputs.web_reproducible || 'true' }}
      server: ${{ steps.detect.outputs.server || 'true' }}
      release_tooling: ${{ steps.detect.outputs.release_tooling || 'true' }}
      desktop_core: ${{ steps.detect.outputs.desktop_core || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's base commit is not in a shallow checkout.
          fetch-depth: 0
      - id: detect
        env:
          DROPPEN_CI_EVENT_NAME: ${{ github.event_name }}
          DROPPEN_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DROPPEN_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci-changes.sh

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The plugin SDK and the plugin host are open core: neither may import
      # the hosted service's code, and the core never imports a plugin.
      - run: pnpm check:plugins
      # Everything the web app asks a machine for names the machine: no
      # page-wide api, transport or un-keyed query key/storage key in web/src.
      - run: pnpm check:machines
      # Every hub route and control message the open clients use is in
      # docs/hub-api/index.json, which agrees with the schemas.
      - run: pnpm check:hub-api
      # web/src/api/schema.d.ts is generated from openapi/openapi.json, the
      # second half of `pnpm gen:api` (the server's tests check the first:
      # that the committed openapi.json is the spec the server serves).
      - run: pnpm --filter @remote-hand/web gen:api && git diff --exit-code -- web/src/api/schema.d.ts
      # web/src/api/hub-schema.d.ts is generated from openapi/hub.json, the
      # hub's deployed public API (refresh it with gen:hub-api after a hub
      # release; this check makes the generated types follow the spec).
      - run: pnpm --filter @remote-hand/web gen:api:hub && git diff --exit-code -- web/src/api/hub-schema.d.ts
      # The open-source boundary check's own tests (the check itself runs in
      # the server job, which has cargo).
      - run: pnpm test:boundary
      - run: pnpm typecheck
      - run: pnpm --filter @droppen/plugin-sdk test
      # The web app's own tests run in the three `web-tests` shards below.
      - run: pnpm --filter @remote-hand/web build

  # The web app's tests (`pnpm --filter @remote-hand/web test`), split by test
  # file into three shards that run side by side: Node's `--test-shard=i/3`
  # (via the `test:shard` script) hands each shard every third file of the same
  # sorted list, so each file runs in exactly one shard. The small runner has
  # two cores, which is why one run of all of them took longer than anything
  # else in the `web` job. Only the web app and what it depends on is
  # installed; typecheck, build and the checks run once, in `web`.
  # A shard that fails does not cancel the others: all three report.
  web-tests:
    needs: changes
    # A job-level `if` is evaluated before the matrix is applied, so gating the
    # job would never create `web-tests (1/2/3)` and their required checks
    # would stay pending. The legs always start; every step below is gated
    # instead, so an unnecessary shard still reports success.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.result != 'success' || needs.changes.outputs.web_tests == 'true'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: needs.changes.result != 'success' || needs.changes.outputs.web_tests == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.result != 'success' || needs.changes.outputs.web_tests == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@remote-hand/web..."
        if: needs.changes.result != 'success' || needs.changes.outputs.web_tests == 'true'
      - run: pnpm --filter @remote-hand/web test:shard
        if: needs.changes.result != 'success' || needs.changes.outputs.web_tests == 'true'


  # The UI spec's machine-checkable invariants (`docs/ui-spec.md` §7): the
  # fixture renders the real components, Playwright measures them, and a
  # failure is a change that drifted from the spec. Every web UI change runs
  # this before it merges.
  ui-audit:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui_audit == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remote-hand/e2e exec playwright install --with-deps chromium
      - run: pnpm ui-audit --check

  # The public web build (what droppen.app serves) is reproducible: two fresh
  # checkouts in different directories, built apart under different time
  # zones, give a byte-identical `web/dist`.
  # A release's web-manifest.json is only worth checking the site against
  # while this holds (docs/web-integrity.md).
  web-reproducible:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web_reproducible == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: first
      - uses: actions/checkout@v4
        with:
          path: second-checkout
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: first/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: first/.nvmrc
      # The verifier's own tests: a fake hub and GitHub on 127.0.0.1.
      - run: node --test first/scripts/verify-web.test.mjs
      # The installer's download checks (a fake release on 127.0.0.1), the
      # release publisher's checks (a stand-in gh; nothing reaches GitHub) and
      # the release page's files table.
      - run: node --test first/scripts/install.test.mjs first/scripts/publish-release.test.mjs first/scripts/release-notes.test.mjs
      - name: Build in the first checkout
        working-directory: first
        env:
          TZ: UTC
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          pnpm install --frozen-lockfile --filter "@remote-hand/web..."
          pnpm --filter @remote-hand/web build
      - name: Build in the second checkout
        working-directory: second-checkout
        env:
          TZ: Pacific/Kiritimati
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          pnpm install --frozen-lockfile --filter "@remote-hand/web..."
          pnpm --filter @remote-hand/web build
      - name: The two builds are identical
        run: diff -r first/web/dist second-checkout/web/dist
      - name: The manifest a release would publish
        run: |
          node first/scripts/web-manifest.mjs first/web/dist --commit "$GITHUB_SHA" --out web-manifest.json
          node first/scripts/web-manifest.mjs second-checkout/web/dist --check web-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-manifest-linux
          path: web-manifest.json

  # The same build on macOS (APFS with its own directory order, other native
  # binaries for esbuild, rollup and Tailwind) must give the Linux bytes: the
  # release's macOS job requires it, and this finds out before a tag does.
  web-reproducible-macos:
    needs: [changes, web-reproducible]
    # As before, only after the Linux run succeeded; `!cancelled()` keeps the
    # detector's own failure from hiding this job (then the first disjunct is
    # true and the Linux job is the gate).
    if: ${{ !cancelled() && needs.web-reproducible.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.web_reproducible == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          pnpm install --frozen-lockfile --filter "@remote-hand/web..."
          pnpm --filter @remote-hand/web build
      - uses: actions/download-artifact@v4
        with:
          name: web-manifest-linux
          path: linux
      - name: The macOS build is the Linux build
        run: node scripts/web-manifest.mjs web/dist --check linux/web-manifest.json

  server:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    # A public repository's ubuntu-latest runner is 4 CPUs and 16 GiB, free
    # and unlimited; the two-core figures this file used to assume made the
    # build and the tests wait on half the machine. It stays GitHub-hosted:
    # the cluster's runners must not run a public repository's pull requests.
    runs-on: ubuntu-latest
    # This job never builds the SPA, and none of the tests needs it.
    env:
      DROPPEN_ALLOW_MISSING_WEB_DIST: "1"
      # Keep backtrace file/line data without full type/variable debug info.
      # Four links at a time on four cores; the 16 GiB is the bound.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4
      # The action has no releases: pinned to a commit of its master branch,
      # which takes the toolchain as an input (the `@stable` branch only
      # fills in that input).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      # cargo-nextest, pinned twice: the action by commit, the tool by version
      # (the action checks the download against the checksum it carries for
      # that version).
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.148
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server-rs -> target
          # Preserve compiled dependencies even when clippy or a test fails.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The open-source boundary (`pnpm check:boundary`, with the runner's own
      # Node): nothing but the hub depends on the hub, no path dependency
      # leaves the repository, and the open crates and web/src name none of
      # the hub's code or environment (docs/local-aggregator.md §2.1).
      - run: node ../scripts/check-open-boundary.mjs
      # No `cargo fmt --check` or clippy gate while the product is young:
      # development speed first; bring them back once it settles.
      # The tests run under cargo-nextest, which runs every test in its own
      # process (settings: server-rs/.config/nextest.toml, profile `ci`).
      # That is what makes them safe to run in parallel: the harness mutates
      # PATH and tests read the process environment from server threads, and
      # on glibc a concurrent setenv/getenv is undefined behaviour that wedged
      # this job on 2026-08-27 (macOS libc tolerates it, which is why it never
      # showed locally). `cargo test` had to run `--test-threads=1` for that;
      # with a process per test no test can write the environment another is
      # reading.
      # nextest does not run doctests, and no crate in the workspace has one
      # (`cargo test` ran zero): a crate that gets one needs a
      # `cargo test --doc -p <crate>` step.
      #
      # One run over the whole workspace: cargo resolves features and compiles
      # each crate once, where a run per crate recompiled the shared graph
      # again for every feature set. `rh-devkit`'s direct-path probe is a
      # feature the default build leaves out, named per package so the other
      # crates still build without it. The timeout keeps any future wedge to
      # minutes, not the 6-hour cap.
      - run: cargo nextest run --profile ci --workspace --features rh-devkit/p2p-probe
        timeout-minutes: 20
      - run: ../scripts/check-sdk-crate-deps.sh
      - name: Report Rust build storage
        if: always()
        run: |
          df -h .
          if [ -d target ]; then du -sh target; fi


  # The release tooling's own checks that no other job runs: the personal-name
  # rule of scripts/release-public.sh's text checks (scripts/release-text-
  # check.sh), and the release workflow's tool helpers. The node release tests
  # (verify-web, install, publish-release, release-notes) already run in
  # `web-reproducible`, so they are not repeated here. No network, no
  # credentials, no build.
  release-tooling:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release_tooling == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/release-text-check.test.sh
      - run: bash .github/scripts/approve-fork-runs.test.sh
      - run: bash .github/scripts/fetch-release-tool.test.sh
      - run: bash .github/scripts/unpack-artifact.test.sh

  # The desktop workspace's tests, without Tauri: `desktop/core` builds on
  # Linux (its macOS-only paths have stubs), and this runs none of the app
  # crate. One test at a time on purpose: in parallel this suite flaked on
  # Linux (ETXTBSY, lock and pid tests), and `--test-threads=1` is what makes
  # it reliable there.
  desktop-core:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop_core == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --manifest-path desktop/Cargo.toml -p droppen-desktop-core -- --test-threads=1


  secrets-scan:
    runs-on: ubuntu-latest
    # The gitleaks CLI, not gitleaks-action: the action wants a paid licence
    # for organisation repositories. The whole history is scanned.
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The open-source boundary (docs/local-aggregator.md §2.1), in the job
      # that always runs and is a required check: the scan covers web/src,
      # web/test, packages/plugin-sdk/src, scripts, the open crates and
      # .github, and a red result must block the merge whichever side changed.
      # ubuntu-latest already has cargo; `cargo metadata --no-deps` is all the
      # check runs.
      - name: The open-source boundary
        run: node scripts/check-open-boundary.mjs
      - name: Install gitleaks
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
