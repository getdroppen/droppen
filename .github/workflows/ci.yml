name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, whatever the repository's default for the token is: no job here
# writes to the repository (artifacts and caches do not need the token).
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The plugin SDK and the plugin host are open core: neither may import
      # the hosted service's code, and the core never imports a plugin.
      - run: pnpm check:plugins
      # Everything the web app asks a machine for names the machine: no
      # page-wide api, transport or un-keyed query key/storage key in web/src.
      - run: pnpm check:machines
      # Every hub route and control message the open clients use is in
      # docs/hub-api/index.json, which agrees with the schemas.
      - run: pnpm check:hub-api
      # The open-source boundary check's own tests (the check itself runs in
      # the server job, which has cargo).
      - run: pnpm test:boundary
      - run: pnpm typecheck
      - run: pnpm --filter @droppen/plugin-sdk test
      - run: pnpm --filter @remote-hand/web test
      # The open distribution (distribution.json): no plugins.
      - run: pnpm --filter @remote-hand/web build
      - run: node -e "const m=require('./web/dist/plugins/manifest.json'); if (m.plugins.length) { console.error('the open build bundles plugins:', m.plugins.map(p=>p.id)); process.exit(1) }"

  # The public web build (what droppen.app serves) is reproducible: two fresh
  # checkouts in different directories, built apart under different time
  # zones, give a byte-identical `web/dist`.
  # A release's web-manifest.json is only worth checking the site against
  # while this holds (docs/web-integrity.md).
  web-reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: first
      - uses: actions/checkout@v4
        with:
          path: second-checkout
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: first/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: first/.nvmrc
      # The verifier's own tests: a fake hub and GitHub on 127.0.0.1.
      - run: node --test first/scripts/verify-web.test.mjs
      - name: Build in the first checkout
        working-directory: first
        env:
          TZ: UTC
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          pnpm install --frozen-lockfile --filter "@remote-hand/web..."
          pnpm --filter @remote-hand/web build
      - name: Build in the second checkout
        working-directory: second-checkout
        env:
          TZ: Pacific/Kiritimati
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          pnpm install --frozen-lockfile --filter "@remote-hand/web..."
          pnpm --filter @remote-hand/web build
      - name: The two builds are identical
        run: diff -r first/web/dist second-checkout/web/dist
      - name: The manifest a release would publish
        run: |
          node first/scripts/web-manifest.mjs first/web/dist --commit "$GITHUB_SHA" --out web-manifest.json
          node first/scripts/web-manifest.mjs second-checkout/web/dist --check web-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-manifest-linux
          path: web-manifest.json

  # The same build on macOS (APFS with its own directory order, other native
  # binaries for esbuild, rollup and Tailwind) must give the Linux bytes: the
  # release's macOS job requires it, and this finds out before a tag does.
  web-reproducible-macos:
    needs: web-reproducible
    # macOS minutes count ten times while the repository is private: run it on
    # main and by hand, not on every pull request.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          pnpm install --frozen-lockfile --filter "@remote-hand/web..."
          pnpm --filter @remote-hand/web build
      - uses: actions/download-artifact@v4
        with:
          name: web-manifest-linux
          path: linux
      - name: The macOS build is the Linux build
        run: node scripts/web-manifest.mjs web/dist --check linux/web-manifest.json

  server:
    runs-on: ubuntu-latest
    # This job never builds the SPA, and none of the tests needs it.
    env:
      RH_ALLOW_MISSING_WEB_DIST: "1"
      # Keep backtrace file/line data without full type/variable debug info.
      # Bound simultaneous links on the hosted runner.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        working-directory: server-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs -> target
          # Preserve compiled dependencies even when clippy or a test fails.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The open-source boundary (`pnpm check:boundary`, with the runner's own
      # Node): nothing but the hub depends on the hub, no path dependency
      # leaves the repository, and the open crates and web/src name none of
      # the hub's code or environment (docs/local-aggregator.md §2.1).
      - run: node ../scripts/check-open-boundary.mjs
      # No `cargo fmt --check` or clippy gate while the product is young:
      # development speed first; bring them back once it settles.
      # The cloud protocol crate: pure functions and in-memory state machines, no
      # processes, so it runs threaded and on its own.
      - run: cargo test -p rh-proto
      # The device side of the hub API (sign-in, the client link, reading and
      # folding streams), shared by the test device and the local install.
      - run: cargo test -p rh-client
      # The relay whole: its rules (rh-relay), and droppen-relay's
      # `tests/relay.rs` from the outside — tickets, sign-ins, revocation, the
      # outage grace, metering, limits — against a fake Hub and the
      # `droppen-relay` binary. No database.
      - run: cargo test -p rh-relay -p droppen-relay
        timeout-minutes: 10
      # The test device with its direct-path probe built in (a feature the
      # default build leaves out, so nothing else compiles it).
      - run: cargo test -p rh-devkit --features p2p-probe
        timeout-minutes: 10
      # The plugin contract crate: pure types and checks, run on their own, and
      # a tree that may reach neither the host nor the hosted service.
      - run: cargo test -p droppen-plugin-sdk
      - run: ../scripts/check-sdk-crate-deps.sh
      # Single-threaded: the harness mutates PATH and tests read the process
      # environment from server threads; on glibc a concurrent setenv/getenv
      # is undefined behaviour and wedged this job on 2026-08-27 (macOS libc
      # tolerates it, which is why it never showed locally). Serial tests
      # leave no concurrent reader while the environment is written.
      # The timeout keeps any future wedge to minutes, not the 6-hour cap.
      - run: cargo test -- --test-threads=1
        timeout-minutes: 20
      - name: Report Rust build storage
        if: always()
        run: |
          df -h .
          if [ -d target ]; then du -sh target; fi


  secrets-scan:
    runs-on: ubuntu-latest
    # The gitleaks CLI, not gitleaks-action: the action wants a paid licence
    # for organisation repositories. The whole history is scanned.
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'
