# The prebuilt tools the release builds download instead of building them:
# each one upstream's own release file, pinned here by its sha256. Every
# download is checked against this file and fails on any difference
# (.github/scripts/fetch-release-tool.sh, which also fixes where each tool
# comes from: the url column must be exactly the one it makes from the tool,
# the version and the platform); these tools are never built, and no hash is
# ever fetched.
#
# cargo-about and tauri-cli are in the versions the source pins
# (ABOUT_VERSION in scripts/release-public.sh, TAURI_CLI_VERSION in
# desktop/build.sh). The AppImage tools tauri-cli's bundler runs for the
# Linux app are pinned here alone, one tagged release for both platforms:
#   linuxdeploy       the build tauri-cli's bundler names
#                     (LINUXDEPLOY_COMMIT_HASH in tauri-bundler's
#                     src/bundle/linux/appimage/linuxdeploy.rs; tauri-cli
#                     2.12.3 has tauri-bundler 2.10.3), so a tauri-cli bump
#                     may need another one;
#   apprun            the AppRun the bundler downloads (apprun-old);
#   appimage-runtime  the AppImage runtime, chosen here: a tagged release of
#                     AppImage/type2-runtime, instead of the `continuous` one
#                     appimagetool would download.
# For a version bump, scripts/update-release-tool-pins.sh prints the new
# lines; a person checks them and commits them here.
#
# tool            version  platform                  sha256                                                            url
