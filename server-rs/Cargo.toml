[package]
name = "remote-hand-server"
version = "0.2.135"
edition = "2021"
publish = false
description = "Droppen local server"
license = "AGPL-3.0-only"

# The lints in `[workspace.lints]` below apply to this package too.
[lints]
workspace = true

# A workspace so the cloud protocol crate (`crates/rh-proto`), the device side
# of the hub API (`crates/rh-client`) and the headless test device
# (`crates/rh-devkit`) share this lockfile and target directory. The root
# package stays the default member, so a bare `cargo build`/`cargo test` here
# still means the server and nothing else.
[workspace]
members = [".", "crates/rh-proto", "crates/rh-relay", "crates/droppen-relay", "crates/rh-client", "crates/rh-devkit", "crates/droppen-plugin-sdk", "crates/droppen-search-path", "crates/droppen-base", "crates/droppen-instance", "crates/droppen-http", "crates/droppen-pty", "crates/droppen-supervisor", "crates/droppen-auth", "crates/droppen-files", "crates/droppen-workbench", "crates/droppen-plugins", "crates/droppen-aggregator", "crates/droppen-sessions", "crates/droppen-agent", "crates/droppen-cloud", "crates/droppen-notify", "crates/droppen-accounts", "crates/droppen-setup", "crates/droppen-provider", "crates/droppen-provider-acp", "crates/droppen-drive", "crates/droppen-provider-codex", "crates/droppen-provider-claude-code"]

# Every member takes serde_json from here, so `preserve_order` is on in every
# build: a `Value` writes its keys in insertion order rather than sorted. Cargo
# unifies features per build and `agent-client-protocol-schema` turns this one
# on with no way off, so a member that took serde_json on its own would write
# different bytes under `cargo test -p <member>` than in a workspace build.
# `scripts/check-serde-json-order.sh` (CI) checks that no member builds
# without it, but for the exempt ones it names, each with its reason.
[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

# Two causes of a program that waits on itself forever. In edition 2021 a
# guard made in a match/if-let/while-let scrutinee lives until the end of the
# whole block, so code reached there (a hook, a callback) can take the same
# lock again; and a std guard held across an `.await` blocks the thread. Both
# are denied for every member, each opted in with `[lints] workspace = true`.
[workspace.lints.clippy]
significant_drop_in_scrutinee = "deny"
await_holding_lock = "deny"

[features]
default = ["embed"]
# Embed the built SPA (`web/dist`) into the binary. Kept default-on; when
# `web/dist` is absent the build script downgrades it to a stub that answers
# with a friendly "run pnpm build" page, so `cargo check` still works.
embed = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
# The cloud protocol (frames, the Noise channel, the device chain, records),
# shared with the hub; see `crates/rh-proto`. Only `agent` uses it: the link to
# a hub, which an instance runs only once it has been enrolled. `runtime` is the
# channel driver (tokio glue) the agent shares with the test device.
# `rtc` is the direct path's WebRTC peer (str0m, sans-IO ICE/DTLS/SCTP on
# pure-Rust crypto): UDP sockets bound per attempt, and only by an enrolled
# agent's link (`agent::direct`; `DROPPEN_AGENT_DIRECT=0` turns it off).
rh-proto = { path = "crates/rh-proto", features = ["runtime", "rtc"] }
# The plugin contract (manifest, ids, document-store wire format). The host
# links it; it links nothing of the host's — see the crate's own manifest.
droppen-plugin-sdk = { path = "crates/droppen-plugin-sdk" }
# The helpers below every subsystem: the clock, text codecs, private files,
# process guards, outbound webhooks, the environment and the program's name.
droppen-base = { path = "crates/droppen-base" }
# The instance: its paths, the directory and lock it owns, who it is and its
# databases.
droppen-instance = { path = "crates/droppen-instance" }
# The HTTP kit every route module builds on: errors, extractors, response
# types, the websocket helpers, the OpenAPI helpers, the origin guard, the
# configuration and the build's identity.
droppen-http = { path = "crates/droppen-http" }
# The supervising process (`up`) and self-update (`POST /api/server/self-upgrade`).
droppen-supervisor = { path = "crates/droppen-supervisor" }
# The pseudo-terminals that outlive the server: the shim this binary runs as
# (`pty-shim`), and the server's end of the link to it.
droppen-pty = { path = "crates/droppen-pty" }
# Local accounts: users, logins, tickets, the login guard and its routes.
droppen-auth = { path = "crates/droppen-auth" }
# Files under the home directory behind the path fence, and the media proxy.
droppen-files = { path = "crates/droppen-files" }
# The panes and the layout around sessions: terminals, apps, screens, prefs.
droppen-workbench = { path = "crates/droppen-workbench" }
# The plugin host: installed packages, their switches, store, routes and assets.
droppen-plugins = { path = "crates/droppen-plugins" }
# Sessions: their vocabulary, stores, listing, attention and usage stats, and
# the `Transcripts` port the readers in `src/sessions` implement.
droppen-sessions = { path = "crates/droppen-sessions" }
# Accounts: the store, rotation, limits, the quota cache and the `Login` port
# each CLI's login in `src/accounts` implements.
droppen-accounts = { path = "crates/droppen-accounts" }
droppen-provider = { path = "crates/droppen-provider" }
# The ACP agents' provider: their runs, their routes, their model list and
# their transcripts. The entry registers it.
droppen-provider-acp = { path = "crates/droppen-provider-acp" }
# Codex's provider: its app-server driver, its threads and their claims, its
# model list, quota reading and login. The entry registers it.
droppen-provider-codex = { path = "crates/droppen-provider-codex" }
# Claude Code's provider: its resident driver, its transcripts and their
# roots, its model list, quota reading and logins, and the flight recorder.
# The entry registers it.
droppen-provider-claude-code = { path = "crates/droppen-provider-claude-code" }
# The drive: starting, sending to and answering sessions, the feeds, the
# instant chats and the scheduled tasks. The entry builds it.
droppen-drive = { path = "crates/droppen-drive" }
# The first-run guide: detection, installs and sign-ins, folders and progress.
droppen-setup = { path = "crates/droppen-setup" }
# The device role: verified copies of the account's other machines.
droppen-aggregator = { path = "crates/droppen-aggregator" }
# The machine role: identity, enrollment, the hub link, chain, relays, streams.
droppen-agent = { path = "crates/droppen-agent" }
# The alert channels: Bark, Web Push and the alert fan-out.
droppen-notify = { path = "crates/droppen-notify" }
# The link to Droppen: the link routes, the remote-view gate, link control and
# the aggregator gateway.
droppen-cloud = { path = "crates/droppen-cloud" }
gotcha = { version = "0.4.1", features = ["openapi"] }
# What gotcha's `Schematic` derive expands to names it.
gotcha_core = "0.4.1"
# Named by no code here (the routes reach axum through gotcha), but the one
# dependency that keeps axum's default features in the binary: gotcha takes
# axum without them, so this is where `tracing` (an extractor's rejection is
# logged under the `axum::rejection` target) and `tower-log` come from. The
# tests' fake push service uses it too.
axum = { version = "0.8", features = ["ws", "multipart"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tower-service = "0.3"
# Compressing the web app's answers (`static_files`), brotli and gzip only: the
# crate is already in the graph (reqwest's), and these are its pure-Rust
# codecs; zstd would link a C library.
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "map-response-body"] }

# The command line of this binary, the relay and the desktop update tool. One
# derive tree per binary; parsing only, so the subcommands' own argument checks
# (a required --hub, a validated instance name) stay where they are.
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

tracing = "0.1"

rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

# Outbound HTTP: `export`'s download, and the tests' clients. The BYO-API
# chat's client is in droppen-drive (`chats`), with the chat it serves.
# `default-features = false` drops
# `default-tls` (native-tls/OpenSSL) so the binary keeps linking nothing but
# rustls; `stream` is what makes the completion response readable chunk by chunk.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset", "json"] }

# An unoptimized argon2 at 64 MiB and three passes takes seconds rather than
# milliseconds, which would put minutes on every `cargo test` run that touches a
# login. Optimizing just the hash — and the compression function under it —
# leaves the rest of the debug build alone, so a backtrace through this server's
# own code is still a debug backtrace.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
# What the tests reach that the server's own code does not name, each at the
# spec it had as a dependency: signals and process groups for the stand-in
# CLIs (`libc`); the stores the tests read back, read-only (`rusqlite`); the
# scans of the sources for registered routes and credential mentions
# (`regex`); a device's push key and an enrollment code (`p256`, `rand`); the
# device's copy of a machine's index in the gateway's tests (`rh-client`).
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
rh-client = { path = "crates/rh-client" }
# Reading a compressed answer back (`static_files`' tests).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The source scans of the spawn gate and the runs (`provider_tests::gate`):
# each file parsed, what it builds for tests alone dropped, and the rest read
# token by token; `toml` reads a crate's manifest for whether it depends on the
# provider base. The versions the lock has already, for tests alone; with
# `span-locations`, a file the scans cannot parse is named with its line.
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = "0.8"
# Scratch homes and directories for the tests.
tempfile = "3"
# `start_paused` runtimes, so the websocket heartbeat's minute-scale schedule can
# be asserted without a test that actually takes minutes.
tokio = { version = "1", features = ["test-util"] }
# A websocket client for the tests of this server's own websocket routes: the
# feeds, the terminals, the cloud gateway. The version axum already links;
# rustls with the ring provider and webpki roots, as droppen-agent has it.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# The child-PATH override per test thread, which the unit tests that set it
# rely on (`setup::tests::ChildPathGuard`): see the feature's own comment.
droppen-base = { path = "crates/droppen-base", features = ["test-support"] }
# The device role's test switch and a published index slot, for the tests of
# the controller under a real agent state and of the gateway.
droppen-aggregator = { path = "crates/droppen-aggregator", features = ["test-support"] }
# What the tests of `cloud::control`, the `agent` command line and the bridge's
# route classification reach of the agent's files (`droppen_agent::testing`), and
# transcripts made the way the loader makes them (`streams::test_transcripts`).
droppen-agent = { path = "crates/droppen-agent", features = ["test-support"] }
# A link whose frames are all queued at once, for the terminal tests
# (`droppen_pty::client::Link::preloaded`).
droppen-pty = { path = "crates/droppen-pty", features = ["test-support"] }
# The live setup code and a hold on the account store's writes, for the tests
# of the guard and the `/api/auth/*` routes (`api::auth_routes`).
droppen-auth = { path = "crates/droppen-auth", features = ["test-support"] }
# Plugin packages built in code and a host with some installed
# (`droppen_plugins::testing`), for the feed's and the settings route's tests
# and the plugin routes' and assets' (`api::plugins_routes`, `api::plugins_serve`).
droppen-plugins = { path = "crates/droppen-plugins", features = ["test-support"] }
# The lock the tests that install the process-wide session index take, and a
# transcript parse forgotten as a restart forgets it (`droppen_sessions::{index,
# loader}`), for the readers', the feed's and the routes' tests.
droppen-sessions = { path = "crates/droppen-sessions", features = ["test-support"] }
# The scratch-less paths and the stub CLI the logins' checks are tested with
# (`droppen_accounts::verify`), for the tests of each CLI's login.
droppen-accounts = { path = "crates/droppen-accounts", features = ["test-support"] }
droppen-provider = { path = "crates/droppen-provider", features = ["test-support"] }
# What the server's tests reach of the drive (`droppen_drive::testing`): the
# search and first-unread helpers, and the list broadcast's capacity.
droppen-drive = { path = "crates/droppen-drive", features = ["test-support"] }
# An ACP agent configured without the gate, and an agent's last check
# recorded (`droppen_provider_acp::testing`), for the provider registry's and
# the agents' routes' tests.
droppen-provider-acp = { path = "crates/droppen-provider-acp", features = ["test-support"] }
# The resident's test harness (`resident::test_harness`), for the test in
# `api::feed_session` that runs a resident through a real session feed.
droppen-provider-claude-code = { path = "crates/droppen-provider-claude-code", features = ["test-support"] }
# The guide's stand-in logins, its state without a server and its runner
# fixture (`droppen_setup::{testing, runner::fixture}`), for the server's tests
# of the guide on its own logins (`src/setup_tests.rs`).
droppen-setup = { path = "crates/droppen-setup", features = ["test-support"] }
# The options a parsed `notify` command line asks for, for its tests through
# this binary's command tree (`cli::tests::notify`, `droppen_notify::testing`).
droppen-notify = { path = "crates/droppen-notify", features = ["test-support"] }
# What the tests of the cloud routes, the remote-view gate and link control
# (`api::cloud_routes`, `api::cloud_control`) reach of cloud (`droppen_cloud::testing`).
droppen-cloud = { path = "crates/droppen-cloud", features = ["test-support"] }
