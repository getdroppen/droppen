[package]
name = "remote-hand-server"
version = "0.2.133"
edition = "2021"
publish = false
description = "Droppen local server"
license = "AGPL-3.0-only"

# A workspace so the cloud protocol crate (`crates/rh-proto`), the device side
# of the hub API (`crates/rh-client`) and the headless test device
# (`crates/rh-devkit`) share this lockfile and target directory. The root
# package stays the default member, so a bare `cargo build`/`cargo test` here
# still means the server and nothing else.
[workspace]
members = [".", "crates/rh-proto", "crates/rh-relay", "crates/droppen-relay", "crates/rh-client", "crates/rh-devkit", "crates/droppen-plugin-sdk", "crates/droppen-path"]

[features]
default = ["embed"]
# Embed the built SPA (`web/dist`) into the binary. Kept default-on; when
# `web/dist` is absent the build script downgrades it to a stub that answers
# with a friendly "run pnpm build" page, so `cargo check` still works.
embed = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
# The cloud protocol (frames, the Noise channel, the device chain, records),
# shared with the hub; see `crates/rh-proto`. Only `agent` uses it: the link to
# a hub, which an instance runs only once it has been enrolled. `runtime` is the
# channel driver (tokio glue) the agent shares with the test device.
# `rtc` is the direct path's WebRTC peer (str0m, sans-IO ICE/DTLS/SCTP on
# pure-Rust crypto): UDP sockets bound per attempt, and only by an enrolled
# agent's link (`agent::direct`; `DROPPEN_AGENT_DIRECT=0` turns it off).
rh-proto = { path = "crates/rh-proto", features = ["runtime", "rtc"] }
# What a device does at a hub (a device session, the /v1/client link, reading
# a machine's streams), shared with the test device: this computer's device
# role (`aggregator`, local-aggregator §4.2) speaks it.
rh-client = { path = "crates/rh-client" }
# The plugin contract (manifest, ids, document-store wire format). The host
# links it; it links nothing of the host's — see the crate's own manifest.
droppen-plugin-sdk = { path = "crates/droppen-plugin-sdk" }
# The PATH rule the setup guide rebuilds at boot: shared with the desktop app
# (`desktop/core/src/env_path.rs`), which is not part of this workspace.
droppen-path = { path = "crates/droppen-path" }
# Machine-signed stream heads and manifests (the agent's streams).
ed25519-dalek = "2"
# The agent's one outbound websocket to the hub, and its loopback sockets to
# this server's own feed and terminal routes. The version axum already links;
# rustls with the ring provider and webpki roots, like `reqwest` below.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# The agent's machine seed is wiped from memory when dropped. Already in the
# graph through rh-proto and the RustCrypto crates.
zeroize = "1"
gotcha = { version = "0.4.1", features = ["openapi"] }
# Direct dependency so `openapi_ext` can open a schema-collection scope
# (`registry::collect`) — `gotcha` re-exports the traits but not the registry.
gotcha_core = "0.4.1"
# gotcha's own config loader has no defaults source, which makes
# `APP_SERVER__PORT` unusable — see `src/config.rs`. Driving mofa directly is
# the fix; the version is pinned to gotcha's so there is only ever one copy.
mofa = "0.2"

axum = { version = "0.8", features = ["ws", "multipart"] }
# The `/embed/{id}/*` reverse proxy needs what gotcha's router cannot reach: an
# upstream HTTP client that streams, and `hyper::upgrade` on both ends of a
# websocket. Both are already in the graph as axum's own dependencies; naming
# them here pins the same versions rather than adding a second copy.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tower-service = "0.3"
# Compressing the web app's answers (`static_files`), brotli and gzip only: the
# crate is already in the graph (reqwest's), and these are its pure-Rust
# codecs; zstd would link a C library.
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "map-response-body"] }
libc = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

notify = "7"
sha2 = "0.10"
base64 = "0.22"
# Compressing the websocket frames a client asks to have compressed (see
# `feed::mux`). tungstenite has no permessage-deflate, and nothing between the
# server and a browser compresses a websocket for it. The backend is the one
# already in the graph.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Reading a plugin package's tar (`crate::plugins::install`). The gzip half is
# `flate2` above. Hand-rolling the header parser (ustar, GNU long names, PAX
# extensions, checksums) would be exactly the kind of security-sensitive parsing
# a vetted crate should do instead; the installer still reads entries itself,
# refusing anything but regular files and directories rather than extracting
# with the tar's own modes and links.
tar = "0.4"

# Web Push (`crate::push`), hand-rolled on RustCrypto rather than taken from the
# `web-push` crate: that one reaches ECE and from there `openssl-sys`, and this
# binary deliberately links nothing but rustls (see `reqwest` below) so it can be
# built static against musl. `ecdh` is the feature RFC 8291's key agreement
# needs; the ECDSA half that signs RFC 8292's VAPID header is in p256's defaults.
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
aes-gcm = "0.10"
# The keyed MAC `crate::notify::token` mints session tokens with. Already in the
# graph — `hkdf` is HMAC with a label on it — and named here for the reason
# `subtle` below is: an implicit dependency is one `cargo update` away from
# disappearing, and this one is a security boundary.
hmac = "0.12"
# The per-message ephemeral key and salt. p256 0.13 speaks `rand_core` 0.6,
# which is the version rand 0.8's `OsRng` implements.
rand = "0.8"
# Local account passwords (`crate::auth`). RustCrypto's own Argon2, so the
# "nothing but rustls" rule above still holds: it is pure Rust and pulls in no
# system crypto library. `std` is what gives `password_hash::Error` an
# `std::error::Error` impl, which the CLI's error plumbing wants.
argon2 = { version = "0.5", features = ["std"] }
# Constant-time comparison of session-token digests. Already in the graph (p256,
# aes-gcm and every other RustCrypto crate depend on it); named here because
# `crate::auth::sessions` uses it directly, and an implicit dependency is one
# `cargo update` away from disappearing.
subtle = "2"
regex = "1"
# The unread scan's prefilter: a SIMD substring search over raw transcript bytes,
# so the tool output that is most of a transcript is never decoded or parsed.
memchr = "2"
# Screen icons are single graphemes, including flags and joined emoji.
unicode-segmentation = "1"
thiserror = "1"
# `randomUUID()`'s replacement: new session ids and account ids are v4 uuids.
uuid = { version = "1", features = ["v4"] }
# Codex's thread index. `bundled` compiles SQLite itself rather than linking the
# platform's, so discovery does not depend on what the host happens to ship.
rusqlite = { version = "0.32", features = ["bundled"] }

rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

# The web terminals' pseudo-terminals.
portable-pty = "0.9"
# A terminal emulator with no terminal: the pty shim feeds it every byte the
# shell produces so a client that attaches an hour late can be handed a repaint
# of the screen rather than an hour of scrollback. `vim` cannot be reconstructed
# from its own output; it can be reconstructed from the state that output made.
vt100 = "0.16.2"

# The BYO-API chat's outbound HTTP. `default-features = false` drops
# `default-tls` (native-tls/OpenSSL) so the binary keeps linking nothing but
# rustls; `stream` is what makes the completion response readable chunk by chunk.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset", "json"] }

# The cron half of `crate::schedule`. croner is pure Rust with no clock of its own, and its DST handling is the reason it was
# not hand-rolled: it resolves each candidate wall-clock time through the time
# library rather than assuming every day is 24 hours long. `default-features =
# false` drops the `jiff` backend, since the `chrono` one below is the only one
# this crate speaks.
croner = { version = "4", default-features = false, features = ["chrono"] }
# The calendar croner does that arithmetic against, and the parser that reads a
# stored ISO-8601 stamp back. Already in the graph as a transitive dependency, so
# naming it here downloads nothing new; named for the reason `subtle` and `hmac`
# are, one paragraph up — an implicit dependency is one `cargo update` away from
# disappearing, and a scheduler that cannot tell the time is a scheduler that
# does not run. Default features, because `clock` is what gives `Local` its
# offset and the local zone *is* the contract (see `schedule::cron`).
chrono = "0.4"
# An unoptimized argon2 at 64 MiB and three passes takes seconds rather than
# milliseconds, which would put minutes on every `cargo test` run that touches a
# login. Optimizing just the hash — and the compression function under it —
# leaves the rest of the debug build alone, so a backtrace through this server's
# own code is still a debug backtrace.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
tempfile = "3"
# `start_paused` runtimes, so the websocket heartbeat's minute-scale schedule can
# be asserted without a test that actually takes minutes.
tokio = { version = "1", features = ["test-util"] }
