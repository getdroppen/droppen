[package]
name = "rh-relay"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Droppen's relay, the library (the binary is the droppen-relay crate): pairs a device's channel with a machine's and copies the ciphertext between them, on tickets the Hub signs"

# The library only. The `droppen-relay` binary that runs it is its own package
# (`crates/droppen-relay`), with its own licence, and so are the tests that
# drive that binary.
[lib]
name = "rh_relay"
path = "src/lib.rs"

[dependencies]
# No `runtime` feature: a relay never runs a channel, it only copies frames.
rh-proto = { path = "../rh-proto" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# The relay's own key (it signs in on the Hub and proves its origin with it).
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
zeroize = "1"
# The control link to the Hub: the one connection a relay dials out.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
# Built alone (`cargo build -p droppen-relay`, the Dockerfile) nothing else
# picks rustls's crypto provider: ring, as everywhere in this workspace.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[lints]
workspace = true
