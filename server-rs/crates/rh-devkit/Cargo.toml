[package]
name = "rh-devkit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "A headless remote-hand device for tests: signs up at a hub, keeps a device chain, enrolls machines and opens end-to-end channels"

# The direct-path measurement probe (`src/bin/rh-p2p-probe.rs`): a WebRTC
# DataChannel peer for `web/dev/p2p-probe.html`. Behind a feature so the
# hub's tests, which link this crate, never build a WebRTC stack.
[[bin]]
name = "rh-p2p-probe"
path = "src/bin/rh-p2p-probe.rs"
required-features = ["p2p-probe"]

[features]
p2p-probe = ["dep:str0m"]
# The headless device's direct-path client (str0m through `rh-proto/rtc`),
# for an end-to-end run's direct leg. Off by default so the hub's tests, which
# link this crate, never build a WebRTC stack.
direct = ["rh-proto/rtc"]

[dependencies]
rh-proto = { path = "../rh-proto", features = ["runtime"] }
# What a device does at a hub, shared with the local install: sign-in, the
# /v1/client link, reading streams. Re-exported under its old names here.
rh-client = { path = "../rh-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util", "fs", "signal"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
# A software passkey for the hub's tests (`passkey`): ES256 and RS256 signing
# by ring, which rustls already links; the hashes and base64url of WebAuthn.
ring = "0.17"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sans-IO WebRTC (ICE, DTLS, SCTP) for the p2p probe, on pure-Rust crypto.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"], optional = true }
