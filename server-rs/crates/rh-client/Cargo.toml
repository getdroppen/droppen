[package]
name = "rh-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The device side of the Droppen hub API in Rust: device sessions, the /v1/client link, and reading a machine's encrypted streams"

# Open source, like rh-proto: it speaks only the documented hub API
# (`docs/hub-api/`) and never links rh-hub. Its users are the headless test
# device (rh-devkit) and the local install's aggregator (`remote-hand-server`'s
# `aggregator`); later the desktop app's Rust side.

[dependencies]
rh-proto = { path = "../rh-proto" }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
zeroize = "1"

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }

[lints]
workspace = true
