[package]
name = "droppen-session-proxy"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "droppen session-proxy: a device of the account that takes a small session HTTP surface and carries each request over an end-to-end channel to a computer's /api/sessions/*"

# A standalone device (`droppen-client`'s `device`) behind an HTTP listener.
# It names none of the server's subsystems: the `droppen` binary only starts it
# (`droppen session-proxy`).
[dependencies]
droppen-client = { path = "../droppen-client" }
# The verified chain it judges a refusal by.
droppen-proto = { path = "../droppen-proto" }
axum = "0.8"
futures-util = "0.3"
serde_json = { workspace = true }
# The proxy token compared in constant time, through a digest of each side
# so the lengths say nothing either.
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
# Its log, when it runs on its own (a container): the relay's set-up.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The proxy token (and the enrollment code) are wiped from memory when dropped.
zeroize = "1"

[lints]
workspace = true

[dev-dependencies]
# The end-to-end test reuses droppen-client's stand (`tests/support`): a relay
# in this process, a test hub, a host's agent on the relay.
droppen-proto = { path = "../droppen-proto", features = ["runtime"] }
droppen-relay-core = { path = "../droppen-relay-core" }
axum = { version = "0.8", features = ["ws"] }
ed25519-dalek = "2"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
serde_json = { workspace = true }
